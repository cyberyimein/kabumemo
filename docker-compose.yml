services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: kabumemo-backend
    ports:
      - "9527:8000"
    environment:
      # 容器内的数据目录，后端代码已经使用该环境变量
      KABUCOUNT_DATA_DIR: /data
      # 前端打包产物挂载到这里，由后端直接提供静态文件
      KABUMEMO_DIST_DIR: /frontend_dist
    volumes:
      # 正式数据目录（JSON + kabumemo.db），请通过本地 .env 设置 KABUMEMO_DATA_DIR
      - ${KABUMEMO_DATA_DIR:-./server-data}:/data
    restart: unless-stopped
